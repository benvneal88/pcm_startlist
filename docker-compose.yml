version: '3.8'

services:
  backend-db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - backend-db-vol:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8080:5000"
    volumes:
      - ./src/data:/PCMStartListApp/src/data
    depends_on:
      - backend-db
    restart: unless-stopped

volumes:
  backend-db-vol:
